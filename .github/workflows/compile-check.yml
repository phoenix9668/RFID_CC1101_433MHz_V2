name: Compile check

on:
  push:
    branches: [panting]
  pull_request:
    branches: [panting]

jobs:
  compile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arm-none-eabi-gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
          arm-none-eabi-gcc --version

      - name: Compile every source file (MCU target, object-only)
        # This project's RNG driver links against a Keil-only prebuilt library
        # (Core/Src/STM32_Cryptographic/Lib/*_KEIL_*.lib), so a full firmware
        # link isn't possible with the GNU toolchain. This step instead
        # compiles every .c file to a .o with the real MCU flags/defines/
        # include paths, which still catches syntax errors, type errors,
        # missing headers, and macro issues across the whole codebase.
        run: |
          set -euo pipefail

          CFLAGS=(
            -mcpu=cortex-m0plus -mthumb -mfloat-abi=soft
            -std=c11 -Wall
            -DUSE_FULL_LL_DRIVER -DUSE_HAL_DRIVER -DSTM32L051xx
            -ICore/Inc -ICore/Inc/STM32_Cryptographic/Inc
            -IDrivers/STM32L0xx_HAL_Driver/Inc
            -IDrivers/STM32L0xx_HAL_Driver/Inc/Legacy
            -IDrivers/CMSIS/Device/ST/STM32L0xx/Include
            -IDrivers/CMSIS/Include
          )

          mkdir -p build/obj
          fail=0
          for f in Core/Src/*.c Drivers/STM32L0xx_HAL_Driver/Src/*.c; do
            echo "::group::$f"
            if ! arm-none-eabi-gcc "${CFLAGS[@]}" -c "$f" -o "build/obj/$(basename "$f").o"; then
              fail=1
            fi
            echo "::endgroup::"
          done

          exit $fail
